name: Scan

on:
  workflow_dispatch:
    inputs:
      branche:
        description: Branche
        required: true
      ort:
        description: Ort
        required: true
      tiefe:
        description: Tiefe (1-6, je ~20 Treffer)
        default: '3'
      id:
        description: Such-ID (vergibt die Seite)
        default: ''

# Scans nacheinander, nie parallel — sonst ueberschreiben sie sich die Daten.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Google Maps durchsuchen und Websites prüfen
        env:
          BRANCHE: ${{ inputs.branche }}
          ORT: ${{ inputs.ort }}
          TIEFE: ${{ inputs.tiefe }}
          SID: ${{ inputs.id }}
        run: node scan.mjs "$BRANCHE" "$ORT" "$TIEFE" "$SID"
        continue-on-error: true
      - name: Ergebnis speichern
        run: |
          git config user.name "webradar-bot"
          git config user.email "webradar-bot@users.noreply.github.com"
          git add data/leads.json data/searches.json
          git commit -m "Scan: ${{ inputs.branche }} in ${{ inputs.ort }}" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Seite bauen
        run: |
          mkdir -p _site/data
          cp -r public/* _site/
          cp data/*.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
