name: Scan
run-name: Scan ${{ inputs.id }} — ${{ inputs.branche }} in ${{ inputs.ort }}

on:
  workflow_dispatch:
    inputs:
      branche:
        description: Branche
        required: true
      ort:
        description: Ort
        required: true
      tiefe:
        description: Tiefe (1-6, je ~20 Treffer)
        default: '3'
      id:
        description: Such-ID (vergibt die Seite)
        default: ''

# Scans nacheinander, nie parallel — sonst ueberschreiben sie sich die Daten.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Google Maps durchsuchen und Websites prüfen
        env:
          BRANCHE: ${{ inputs.branche }}
          ORT: ${{ inputs.ort }}
          TIEFE: ${{ inputs.tiefe }}
          SID: ${{ inputs.id }}
        run: node scan.mjs "$BRANCHE" "$ORT" "$TIEFE" "$SID"
        continue-on-error: true
      - name: Ergebnis speichern
        env:
          MSG: "Scan: ${{ inputs.branche }} in ${{ inputs.ort }}"
        run: |
          set -e
          git config user.name "webradar-bot"
          git config user.email "webradar-bot@users.noreply.github.com"
          # Git kann JSON nicht zusammenfuehren: erst auf Datenebene mischen, dann
          # sauber auf den aktuellen Stand setzen und pushen. Bei Gegenverkehr wiederholen.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            node merge-data.mjs origin/main
            git reset -q --soft origin/main
            node lead.mjs brief 15 > data/top-leads.md
            git add data/leads.json data/searches.json data/top-leads.md
            if git diff --cached --quiet; then echo "Keine Aenderungen"; exit 0; fi
            git commit -q -m "$MSG"
            if git push -q; then echo "Gespeichert"; exit 0; fi
            echo "Push abgelehnt, neuer Versuch $i"
            sleep $((RANDOM % 5 + 3))
          done
          echo "Ergebnis konnte nicht gespeichert werden" >&2
          exit 1
      - name: Seite bauen
        run: |
          mkdir -p _site/data
          cp -r public/* _site/
          cp -r data/. _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
